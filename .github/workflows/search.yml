name: (일회성) 지정 공고 가져오기
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt playwright && python -m playwright install --with-deps chromium >/dev/null
      - env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TZ: Asia/Seoul
        run: PYTHONPATH=. python tools/fetch_jobs.py
      - run: |
          git config user.name "nurse-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data && (git diff --cached --quiet || (git commit -m "지정 공고 가져오기" && git push))
