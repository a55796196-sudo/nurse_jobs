name: 인스타 업로드

# 1) Actions 탭에서 수동 실행 (승인 버튼)
# 2) 저장소 변수 IG_AUTO_POST=true 이면 새 카드뉴스가 올라올 때 자동 실행
on:
  push:
    branches: [main]
    paths: ["docs/20*/card-00.jpg"]
  workflow_dispatch:
    inputs:
      day:
        description: "업로드할 날짜 (YYYY-MM-DD, 비우면 오늘)"
        required: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || vars.IG_AUTO_POST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          DAY_INPUT: ${{ inputs.day }}
        run: python -m src.instagram "${DAY_INPUT:-$(TZ=Asia/Seoul date +%F)}"
