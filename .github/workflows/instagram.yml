name: 인스타 업로드

# 1) 예약 업로드: 기본으로 켜짐 (끄려면 저장소 변수 IG_AUTO_POST=false). 실행마다 0~15분 무작위로 늦게 시작하고,
#    피드 최대 1개 + 그날 스토리 전부를 1.5~3분 간격으로 올림. 하루 4번(KST 08·12·18·21시 무렵) 실행
# 2) 수동 실행: Actions 탭 → Run workflow
#      비우면 다음 게시물 1개 / YYYY-MM-DD 면 그날 전부 / guides/YYYY-MM-DD 면 가이드 카드뉴스
# 올린 기록은 data/ig_posted.json 에 저장되어 같은 게시물을 두 번 올리지 않음
on:
  schedule:
    - cron: "7 23 * * *"   # 08:07 KST
    - cron: "7 3 * * *"    # 12:07 KST
    - cron: "7 9 * * *"    # 18:07 KST
    - cron: "7 12 * * *"   # 21:07 KST
  workflow_dispatch:
    inputs:
      target:
        description: "비우면 다음 1개 / YYYY-MM-DD / YYYY-MM-DD/roundup / guides/YYYY-MM-DD"
        required: false
      dry_run:
        description: "시험 실행 (실제로 올리지 않고 목록·캡션만 출력)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || vars.IG_AUTO_POST != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: 무작위 대기 (예약 실행만)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 900))
      - name: 업로드
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://a55796196-sudo.github.io/nurse_jobs' }}
          TARGET: ${{ inputs.target }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -m src.instagram "${TARGET:-next}" $DRY
      - name: 올린 기록 저장
        if: always()
        run: |
          git config user.name "nurse-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ig_posted.json data/ig_cooldown.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "인스타 업로드 기록 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
