name: 인스타 토큰 확인

# IG_ACCESS_TOKEN 이 작동하는지, 인스타 계정 ID(IG_USER_ID)가 무엇인지 로그에 출력 (토큰 값은 출력하지 않음)
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 확인
        env:
          TOK: ${{ secrets.IG_ACCESS_TOKEN }}
          UID_SET: ${{ secrets.IG_USER_ID != '' }}
          IGUID: ${{ secrets.IG_USER_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.parse
          tok = os.environ["TOK"]
          print("IG_ACCESS_TOKEN 길이:", len(tok), "/ 앞 4글자:", tok[:4])
          print("IG_USER_ID 등록됨:", os.environ["UID_SET"])
          def get(host, path, fields):
              url = f"https://{host}/v23.0/{path}?" + urllib.parse.urlencode({"fields": fields, "access_token": tok})
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return {"error": json.load(e).get("error", {}).get("message")}
          def clean(o):  # 응답 속 토큰 제거
              if isinstance(o, dict):
                  return {k: clean(v) for k, v in o.items() if "token" not in k}
              if isinstance(o, list):
                  return [clean(v) for v in o]
              return o
          def show(host, path, fields=""):
              r = get(host, path, fields)
              print(f"\n▶ {host}/{path} ({fields})")
              print(json.dumps(clean(r), ensure_ascii=False, indent=1)[:1500])
              return r
          F = "graph.facebook.com"
          uid = os.environ.get("IGUID", "").strip()
          if uid:
              print("IG_USER_ID 길이:", len(uid), "/ 숫자만:", uid.isdigit())
              show(F, uid, "id,username,name,media_count")
              show(F, f"{uid}/content_publishing_limit", "quota_usage,config")
          show(F, "me", "id,name")
          show(F, "me/accounts", "name,instagram_business_account{id,username}")
          show(F, "me/instagram_accounts", "id,username")
          biz = show(F, "me/businesses", "id,name")
          for b in (biz.get("data") or []) if isinstance(biz, dict) else []:
              show(F, f"{b['id']}/owned_instagram_accounts", "id,username")
              show(F, f"{b['id']}/instagram_business_accounts", "id,username")
              show(F, f"{b['id']}/instagram_accounts", "id,username")
              show(F, f"{b['id']}/owned_pages", "name,instagram_business_account{id,username}")
          dbg = urllib.parse.urlencode({"input_token": tok, "access_token": tok})
          try:
              with urllib.request.urlopen(f"https://{F}/debug_token?{dbg}", timeout=30) as r:
                  d = json.load(r).get("data", {})
              print("\n▶ debug_token")
              print(json.dumps({k: d.get(k) for k in ("type", "is_valid", "expires_at", "scopes", "granular_scopes")}, ensure_ascii=False, indent=1))
          except urllib.error.HTTPError as e:
              print("debug_token 실패:", json.load(e).get("error", {}).get("message"))
          EOF
