name: 매일 탈임상 공고 수집 (무료)

on:
  schedule:
    - cron: "41 9 * * *"    # 매일 한국시간 18:41 → 다음 날 아침 발행용 (예약 실행은 1시간 정도 늦어질 수 있음)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 채용사이트 읽기 도구 설치 (브라우저·글자인식)
        run: sudo apt-get install -y -q tesseract-ocr tesseract-ocr-kor >/dev/null
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium >/dev/null

      - name: 수집 (API 키가 있으면 분류·카드까지)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SARAMIN_KEY: ${{ secrets.SARAMIN_KEY }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then python -m src.main run; else python -m src.main collect; fi

      - name: 결과 저장
        id: commit
        run: |
          git config user.name "nurse-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "공고 업데이트 $(TZ=Asia/Seoul date +%F)"
            # 그사이 다른 작업이 push 했으면 합쳐서 다시 (최대 4번)
            for i in 1 2 3 4; do git pull --rebase -q origin main && git push && break; sleep $((i*5)); done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
