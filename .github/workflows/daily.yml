name: 매일 탈임상 공고 수집 (무료)

on:
  schedule:
    - cron: "17 20 * * *"   # 매일 한국시간 오전 5:17 (GitHub 예약 실행은 최대 1시간 정도 늦어질 수 있음)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 수집 (API 키가 있으면 분류·카드까지)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SARAMIN_KEY: ${{ secrets.SARAMIN_KEY }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then python -m src.main run; else python -m src.main collect; fi

      - name: 결과 저장
        id: commit
        run: |
          git config user.name "nurse-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "공고 업데이트 $(TZ=Asia/Seoul date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
