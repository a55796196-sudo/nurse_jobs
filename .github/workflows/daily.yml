name: 매일 탈임상 공고 수집

on:
  schedule:
    - cron: "47 21 * * *"   # 매일 한국시간 오전 6:47
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 한글 폰트 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      - run: pip install -r requirements.txt

      - name: 수집 · 분류 · 카드뉴스 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SARAMIN_KEY: ${{ secrets.SARAMIN_KEY }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
        run: python -m src.main

      - name: 결과 저장
        id: commit
        run: |
          git config user.name "nurse-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "공고 업데이트 $(TZ=Asia/Seoul date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 인스타 자동 업로드 (IG_AUTO_POST=true 일 때만)
        if: steps.commit.outputs.changed == 'true' && vars.IG_AUTO_POST == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          DAY=$(TZ=Asia/Seoul date +%F)
          if [ -f "docs/$DAY/card-00.jpg" ]; then python -m src.instagram "$DAY"; fi
