name: 채용사이트 상세 다시 읽기 (수동)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q tesseract-ocr tesseract-ocr-kor >/dev/null
      - run: pip install -q -r requirements.txt playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python -m src.main enrich
      - run: |
          git config user.name "nurse-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "채용사이트 상세 읽기 $(TZ=Asia/Seoul date +%F)" && git push)
