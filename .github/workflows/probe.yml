name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m probe_tmp.p
      - run: |
          git config user.name "nurse-jobs-bot"; git config user.email "actions@users.noreply.github.com"
          git add probe_tmp/post.png && git commit -m "임시 이미지" && git push
