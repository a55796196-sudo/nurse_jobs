name: (디버그) 교육청 보건교사 수집 시험
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python -m src.main edutest
