name: (디버그) 채용사이트 상세 읽기 시험
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q tesseract-ocr tesseract-ocr-kor >/dev/null
      - run: pip install -q -r requirements.txt playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: >
          python -m src.main sitetest
          "https://nhimc.recruiter.co.kr/career/jobs/130667"
          "https://nmc.recruiter.co.kr/app/jobnotice/view?systemKindCode=MRS2&jobnoticeSn=271576"
