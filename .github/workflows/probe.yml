name: (임시) 페이지 읽기
on:
  workflow_dispatch:
    inputs:
      urls: {description: "URLs", required: true}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: pip install -q -r requirements.txt && python tools/probe_links.py
