name: 검토 - 공고 링크 확인

# 매일 분류 세션이 build 후 실행 (inputs.day). 고른 공고 링크가 실제 공고로 열리는지 확인해 data/linkcheck/DAY.json 저장
on:
  workflow_dispatch:
    inputs:
      day: {description: "YYYY-MM-DD", required: true}

permissions:
  contents: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python -m src.main linkcheck "${{ inputs.day }}"
      - name: 결과 저장
        run: |
          git config user.name "nurse-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/linkcheck
          git diff --cached --quiet && exit 0
          git commit -m "링크 확인 ${{ inputs.day }}"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push && exit 0; sleep $((i*5)); done
          exit 1
